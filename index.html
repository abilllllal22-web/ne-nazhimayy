<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Не нажимай</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg1:#1a0b2e;--bg2:#3b0d4f;--pink:#ff3d7f;--yellow:#ffd23f;--cyan:#3de0ff;--ink:#fff;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);overflow-x:hidden;
    background:radial-gradient(circle at 20% 20%,#5b1a7a 0,transparent 45%),
               radial-gradient(circle at 80% 80%,#0d3b6b 0,transparent 45%),
               linear-gradient(135deg,var(--bg1),var(--bg2));min-height:100vh}
  .page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;text-align:center}
  .hidden{display:none}

  /* ---------- floating emoji background ---------- */
  .floaters{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .floaters span{position:absolute;bottom:-60px;font-size:28px;opacity:.35;animation:rise linear infinite}
  @keyframes rise{to{transform:translateY(-120vh) rotate(360deg)}}

  /* ---------- page 1 ---------- */
  .warn{position:relative;z-index:1;font-weight:900;letter-spacing:.3em;text-transform:uppercase;font-size:13px;
    color:var(--yellow);border:2px dashed var(--yellow);padding:8px 18px;border-radius:999px;margin-bottom:40px;animation:blink 1.2s steps(2) infinite}
  @keyframes blink{50%{opacity:.35}}
  .btn-wrap{position:relative;z-index:1;width:min(420px,85vw);aspect-ratio:1;display:grid;place-items:center}
  .ring{position:absolute;inset:0;border-radius:50%;border:3px solid var(--pink);opacity:.6;animation:pulse 2s ease-out infinite}
  .ring:nth-child(2){animation-delay:.66s}.ring:nth-child(3){animation-delay:1.33s}
  @keyframes pulse{from{transform:scale(.7);opacity:.8}to{transform:scale(1.15);opacity:0}}
  #bigBtn{position:relative;width:78%;aspect-ratio:1;border-radius:50%;border:none;cursor:pointer;
    font-family:'Rubik Mono One',sans-serif;font-size:clamp(20px,5.5vw,34px);line-height:1.15;color:#fff;
    background:radial-gradient(circle at 35% 30%,#ff8ab0,var(--pink) 45%,#b3004a);
    box-shadow:0 14px 0 #7a0033,0 24px 50px rgba(255,61,127,.55),inset 0 -8px 20px rgba(0,0,0,.25);
    text-shadow:0 3px 0 rgba(0,0,0,.3);transition:transform .15s,box-shadow .15s;padding:10px}
  #bigBtn:hover{transform:translateY(-4px) rotate(-2deg)}
  #bigBtn:active{transform:translateY(12px);box-shadow:0 2px 0 #7a0033,0 8px 20px rgba(255,61,127,.5),inset 0 -8px 20px rgba(0,0,0,.25)}
  .hint{position:relative;z-index:1;margin-top:36px;font-size:15px;opacity:.7;min-height:1.4em;transition:.3s}
  .shake{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-10px) rotate(-4deg)}75%{transform:translateX(10px) rotate(4deg)}}

  /* ---------- page 2 ---------- */
  #p2 h1{position:relative;z-index:1;font-family:'Rubik Mono One',sans-serif;font-size:clamp(28px,7vw,64px);line-height:1.1;
    background:linear-gradient(90deg,var(--yellow),var(--pink),var(--cyan),var(--yellow));background-size:300%;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 4s linear infinite}
  @keyframes flow{to{background-position:300%}}
  #p2 .sub{position:relative;z-index:1;margin:14px 0 40px;font-size:clamp(16px,3.5vw,22px);font-weight:800;opacity:.9}
  .gallery{position:relative;z-index:1;display:flex;gap:clamp(20px,5vw,56px);flex-wrap:wrap;justify-content:center;align-items:flex-start}
  .polaroid{background:#fff;padding:14px 14px 56px;border-radius:6px;width:min(290px,80vw);
    box-shadow:0 20px 50px rgba(0,0,0,.5);position:relative;opacity:0;transform:scale(.3) rotate(-30deg)}
  .polaroid img{width:100%;display:block;border-radius:2px;aspect-ratio:4/5;object-fit:cover}
  .polaroid figcaption{position:absolute;left:0;right:0;bottom:14px;color:#222;font-weight:900;font-size:20px}
  .polaroid::before{content:"";position:absolute;top:-14px;left:50%;width:90px;height:28px;margin-left:-45px;
    background:rgba(255,210,63,.75);transform:rotate(-4deg)}
  .show .polaroid:nth-child(1){animation:drop1 .8s cubic-bezier(.2,1.6,.4,1) .2s forwards}
  .show .polaroid:nth-child(2){animation:drop2 .8s cubic-bezier(.2,1.6,.4,1) .7s forwards}
  .show .polaroid:nth-child(3){animation:drop3 .8s cubic-bezier(.2,1.6,.4,1) 1.2s forwards}
  @keyframes drop3{to{opacity:1;transform:rotate(-3deg)}}
  @keyframes drop1{to{opacity:1;transform:rotate(-6deg)}}
  @keyframes drop2{to{opacity:1;transform:rotate(5deg)}}
  .polaroid:hover{transform:rotate(0) scale(1.05)!important;transition:.25s;z-index:2}
  .back{position:relative;z-index:1;margin-top:48px;background:transparent;color:#fff;border:2px solid rgba(255,255,255,.5);
    font:800 16px 'Nunito',sans-serif;padding:12px 26px;border-radius:999px;cursor:pointer;transition:.2s}
  .back:hover{background:#fff;color:var(--bg2)}
  .confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:5;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<div class="floaters" id="floaters"></div>

<section class="page" id="p1">
  <div class="warn">⚠ Опасная зона ⚠</div>
  <div class="btn-wrap">
    <div class="ring"></div><div class="ring"></div><div class="ring"></div>
    <button id="bigBtn">Балым<br>не<br>нажимай</button>
  </div>
  <p class="hint" id="hint">Серьёзно. Не надо.</p>
</section>

  <button class="back" id="back">← Не нажимать ещё раз</button>
</section>

<script>
  // floating emoji
  const em=['😂','🤡','⚠️','🙈','💥','👀','🤭'];
  const fl=document.getElementById('floaters');
  for(let i=0;i<18;i++){const s=document.createElement('span');s.textContent=em[i%em.length];
    s.style.left=Math.random()*100+'vw';s.style.animationDuration=(10+Math.random()*14)+'s';
    s.style.animationDelay=(-Math.random()*20)+'s';s.style.fontSize=(18+Math.random()*26)+'px';fl.appendChild(s);}

  // button: resists a couple of times before giving up
  const btn=document.getElementById('bigBtn'), hint=document.getElementById('hint');
  const lines=['Я же сказал НЕ нажимай 😠','Последнее предупреждение!!','Ну всё, сама виновата...'];
  let tries=0;
  btn.addEventListener('click',()=>{
    if(tries<lines.length){
      hint.textContent=lines[tries++];hint.style.opacity=1;
      btn.classList.remove('shake');void btn.offsetWidth;btn.classList.add('shake');
      if(tries===lines.length) btn.innerHTML='Ладно,<br>жми 😈';
      return;
    }
    document.getElementById('p1').classList.add('hidden');
    const p2=document.getElementById('p2');p2.classList.remove('hidden');
    requestAnimationFrame(()=>document.getElementById('gallery').classList.add('show'));
    confetti();
  });

  document.getElementById('back').addEventListener('click',()=>{
    tries=0;btn.innerHTML='Балым<br>не<br>нажимай';hint.textContent='Серьёзно. Не надо.';hint.style.opacity=.7;
    document.getElementById('gallery').classList.remove('show');
    document.getElementById('p2').classList.add('hidden');document.getElementById('p1').classList.remove('hidden');
  });

  function confetti(){
    const c=['#ff3d7f','#ffd23f','#3de0ff','#7dff7a','#fff'];
    for(let i=0;i<140;i++){const d=document.createElement('div');d.className='confetti';
      d.style.left=Math.random()*100+'vw';d.style.background=c[i%c.length];
      d.style.animationDuration=(2+Math.random()*3)+'s';d.style.animationDelay=(Math.random()*.8)+'s';
      d.style.borderRadius=Math.random()<.5?'50%':'2px';document.body.appendChild(d);
      setTimeout(()=>d.remove(),6500);}
  }
</script>
